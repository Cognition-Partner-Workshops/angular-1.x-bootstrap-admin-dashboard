<div class="task-todo-container transparent">
  <input
    type="text"
    class="form-control task-todo"
    placeholder="Task to do.."
    [(ngModel)]="newTodoText"
    (keyup.enter)="addToDoItem()"
  />
  <i class="add-item-icon" (click)="addToDoItem()">+</i>
  <div class="box-shadow-border"></div>

  <ul class="todo-list" cdkDropList (cdkDropListDropped)="drop($event)">
    @for (item of todoList; track item) {
    <li class="todo-item" [class.checked]="item.checked" cdkDrag>
      <div class="blur-container"><div class="blur-box"></div></div>
      <i class="mark" [style.background-color]="item.color"></i>
      <label class="todo-checkbox custom-checkbox custom-input-success">
        <input type="checkbox" [(ngModel)]="item.checked" />
        <span class="cut-with-dots">{{ item.text }}</span>
      </label>
      <i class="remove-todo" (click)="removeToDoItem(item)">&#215;</i>
    </li>
    }
  </ul>
</div>
