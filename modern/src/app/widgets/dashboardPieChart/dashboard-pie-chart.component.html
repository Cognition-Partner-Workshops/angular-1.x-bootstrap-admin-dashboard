<div class="row pie-charts">
  @for (chart of charts; track chart.description; let i = $index) {
    <div class="pie-chart-item-container">
      <app-ba-panel panelClass="small-panel">
        <div class="pie-chart-item">
          <div class="chart">
            <svg viewBox="0 0 84 84" width="84" height="84">
              <circle
                class="chart-ring"
                cx="42"
                cy="42"
                [attr.r]="radius"
                fill="none"
                [attr.stroke]="ringColor"
                stroke-width="9"
                stroke-linecap="round"
                [attr.stroke-dasharray]="circumference"
                [attr.stroke-dashoffset]="dashOffset(percents()[i])"
                transform="rotate(-90 42 42)"
              ></circle>
            </svg>
            <span class="percent">{{ percents()[i] }}</span>
          </div>
          <div class="description">
            <div>{{ chart.description }}</div>
            <div class="description-stats">{{ chart.stats }}</div>
          </div>
          <i class="chart-icon">
            @switch (chart.icon) {
              @case ('person') {
                <svg viewBox="0 0 24 24" width="56" height="56" fill="currentColor">
                  <path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/>
                </svg>
              }
              @case ('money') {
                <svg viewBox="0 0 24 24" width="56" height="56" fill="currentColor">
                  <path d="M11.8 10.9c-2.3-.6-3-1.2-3-2.1 0-1.1 1-1.8 2.7-1.8 1.8 0 2.5.9 2.5 2.1h2.2c-.1-1.7-1.1-3.2-3.2-3.7V3h-3v2.3c-1.9.4-3.5 1.7-3.5 3.6 0 2.3 1.9 3.4 4.6 4 2.5.6 3 1.5 3 2.4 0 .7-.5 1.7-2.7 1.7-2 0-2.8-.9-2.9-2.1H6.4c.1 2.1 1.7 3.3 3.6 3.7V21h3v-2.3c1.9-.4 3.5-1.5 3.5-3.6 0-2.8-2.4-3.8-4.7-4.2z"/>
                </svg>
              }
              @case ('face') {
                <svg viewBox="0 0 24 24" width="56" height="56" fill="currentColor">
                  <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm-3.5 8a1.5 1.5 0 1 1 1.5-1.5A1.5 1.5 0 0 1 8.5 10zm7 0a1.5 1.5 0 1 1 1.5-1.5 1.5 1.5 0 0 1-1.5 1.5zM12 17.5A5.5 5.5 0 0 1 6.7 14h10.6a5.5 5.5 0 0 1-5.3 3.5z"/>
                </svg>
              }
              @case ('refresh') {
                <svg viewBox="0 0 24 24" width="56" height="56" fill="currentColor">
                  <path d="M17.65 6.35A8 8 0 1 0 19.73 14h-2.08A6 6 0 1 1 16.24 7.76L13 11h7V4z"/>
                </svg>
              }
            }
          </i>
        </div>
      </app-ba-panel>
    </div>
  }
</div>
