<button
  class="btn"
  [class]="'btn-' + variant + ' btn-' + size"
  [class.btn-full-width]="fullWidth"
  [class.btn-loading]="loading"
  [disabled]="disabled || loading"
  [type]="type"
  (click)="onClick($event)">
  @if (loading) {
    <span class="btn-spinner"></span>
  }
  <span class="btn-content" [class.hidden]="loading">
    <ng-content></ng-content>
  </span>
</button>
