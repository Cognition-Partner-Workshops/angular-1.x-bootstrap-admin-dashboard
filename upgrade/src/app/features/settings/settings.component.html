<div class="settings-page">
  <h2 class="page-title">Settings</h2>

  <div class="settings-section">
    <h3 class="section-title">General Settings</h3>
    <div class="settings-form">
      <div class="form-group">
        <label for="theme">Theme</label>
        <select id="theme" [(ngModel)]="settings.theme">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>

      <div class="form-group">
        <label for="language">Language</label>
        <select id="language" [(ngModel)]="settings.language">
          <option value="en">English</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
        </select>
      </div>

      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" [(ngModel)]="settings.notifications">
          Enable Notifications
        </label>
      </div>

      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" [(ngModel)]="settings.emailAlerts">
          Email Alerts
        </label>
      </div>

      <button class="save-btn" (click)="saveSettings()">Save Settings</button>
    </div>
  </div>

  <div class="settings-section">
    <h3 class="section-title">Feature Flags</h3>
    <div class="loading" *ngIf="loading">Loading feature flags...</div>
    <div class="feature-flags-list" *ngIf="!loading">
      <div class="feature-flag" *ngFor="let flag of featureFlags">
        <div class="flag-name">{{ flag.name }}</div>
        <div class="flag-status" [class.enabled]="flag.enabled">
          {{ flag.enabled ? 'Enabled' : 'Disabled' }}
        </div>
      </div>
    </div>
  </div>
</div>
