<div class="row pie-charts">
  @for (chart of charts; track chart.description; let i = $index) {
    <div class="pie-chart-item-container">
      <div class="panel">
        <div class="pie-chart-item">
          <div class="chart-wrapper">
            <svg class="pie-chart-svg" viewBox="0 0 84 84">
              <circle class="pie-chart-bg" cx="42" cy="42" r="38" />
              <circle class="pie-chart-progress"
                      cx="42" cy="42" r="38"
                      [attr.stroke-dasharray]="getStrokeDasharray(animatedPercents[i])"
                      [style.stroke]="chart.color" />
            </svg>
            <span class="percent">{{ animatedPercents[i] }}</span>
          </div>
          <div class="description">
            <div>{{ chart.description }}</div>
            <div class="description-stats">{{ chart.stats }}</div>
          </div>
          <i class="chart-icon i-{{ chart.icon }}"></i>
        </div>
      </div>
    </div>
  }
</div>
