<div class="row mail-client-container transparent" data-testid="mail-container">
  <div class="col-md-12">
    <app-ba-panel panelClass="xmedium-panel mail-panel">
      <div class="letter-layout">
        <div class="mail-navigation-container" [class.expanded]="!navigationCollapsed">
          <div class="text-center">
            <button type="button" class="btn btn-default compose-button" (click)="showCompose()" data-testid="compose-button">
              Compose
            </button>
          </div>
          @for (tab of tabs; track tab.label) {
            <a class="mail-navigation"
               [routerLink]="['/upgrade/components/mail', tab.label]"
               routerLinkActive="active"
               data-testid="mail-tab">
              {{ tab.name }}
              @if (tab.newMails) {
                <span class="new-mails">{{ tab.newMails }}</span>
              }
            </a>
          }
          <div class="labels">
            <div class="labels-title"></div>
            <div class="labels-container">
              <div class="label-item">
                <span class="tag label work">Work</span>
              </div>
              <div class="label-item">
                <span class="tag label family">Family</span>
              </div>
              <div class="label-item">
                <span class="tag label friend">Friend</span>
              </div>
              <div class="label-item">
                <span class="tag label study">Study</span>
              </div>
            </div>
          </div>
          <div class="add-label-container">
            <i class="ion-plus-round"></i><span class="label-input-stub">Add new label</span>
          </div>
        </div>
        <router-outlet></router-outlet>
      </div>
    </app-ba-panel>
  </div>
</div>
