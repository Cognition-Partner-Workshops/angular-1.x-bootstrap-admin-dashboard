<div class="horizontal-scroll">
  <table class="table table-hover">
    <thead><tr class="black-muted-bg"><th class="browser-icons"></th><th>Browser</th><th class="align-right">Visits</th><th class="table-arr"></th><th class="align-right">Purchases</th><th class="table-arr"></th><th class="align-right">%</th><th class="table-arr"></th></tr></thead>
    <tbody>
      @for (item of rows(); track item.browser) {
        <tr class="no-top-border">
          <td><img [src]="item.image | appImage" width="20" height="20"></td><td>{{ item.browser }}</td><td class="align-right">{{ item.visits }}</td><td class="table-arr"><i [class.icon-up]="item.isVisitsUp" [class.icon-down]="!item.isVisitsUp"></i></td><td class="align-right">{{ item.purchases }}</td><td class="table-arr"><i [class.icon-up]="item.isPurchasesUp" [class.icon-down]="!item.isPurchasesUp"></i></td><td class="align-right">{{ item.percent }}</td><td class="table-arr"><i [class.icon-up]="item.isPercentUp" [class.icon-down]="!item.isPercentUp"></i></td>
        </tr>
      }
    </tbody>
  </table>
</div>
