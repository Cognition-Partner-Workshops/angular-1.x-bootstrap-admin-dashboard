<section class="chartist">
  <div class="row">
    <div class="col-md-6"><div baPanel title="Lines" baPanelClass="with-scroll">
      <h5>Simple line chart</h5><div id="line-chart" class="ct-chart" baChartist chartistType="line" [chartistData]="simpleLineData" [chartistOptions]="simpleLineOptions"></div>
      <h5>Line chart with area</h5><div id="area-chart" class="ct-chart" baChartist chartistType="line" [chartistData]="areaLineData" [chartistOptions]="areaLineOptions"></div>
      <h5>Bi-polar line chart with area only</h5><div id="bi-chart" class="ct-chart" baChartist chartistType="line" [chartistData]="biLineData" [chartistOptions]="biLineOptions"></div>
    </div></div>
    <div class="col-md-6"><div baPanel title="Bars" baPanelClass="with-scroll">
      <h5>Simple bar chart</h5><div id="simple-bar" class="ct-chart" baChartist chartistType="bar" [chartistData]="simpleBarData" [chartistOptions]="simpleBarOptions"></div>
      <h5>Multi-line labels bar chart</h5><div id="multi-bar" class="ct-chart" baChartist chartistType="bar" [chartistData]="multiBarData" [chartistOptions]="multiBarOptions" [chartistResponsive]="multiBarResponsive"></div>
      <h5>Stacked bar chart</h5><div id="stacked-bar" class="ct-chart stacked-bar" baChartist chartistType="bar" [chartistData]="stackedBarData" [chartistOptions]="stackedBarOptions"></div>
    </div></div>
  </div>
  <div class="row"><div class="col-md-12"><div baPanel title="Pies &amp; Donuts" baPanelClass="with-scroll"><div class="row">
    <div class="col-md-12 col-lg-4"><h5>Simple Pie</h5><div id="simple-pie" class="ct-chart" baChartist chartistType="pie" [chartistData]="simplePieData" [chartistOptions]="simplePieOptions" [chartistResponsive]="pieResponsive"></div></div>
    <div class="col-md-12 col-lg-4"><h5>Pie with labels</h5><div id="label-pie" class="ct-chart" baChartist chartistType="pie" [chartistData]="labelsPieData" [chartistOptions]="labelsPieOptions"></div></div>
    <div class="col-md-12 col-lg-4"><h5>Donut</h5><div id="donut" class="ct-chart" baChartist chartistType="pie" [chartistData]="simpleDonutData" [chartistOptions]="simpleDonutOptions" [chartistResponsive]="donutResponsive"></div></div>
  </div></div></div></div>
</section>
