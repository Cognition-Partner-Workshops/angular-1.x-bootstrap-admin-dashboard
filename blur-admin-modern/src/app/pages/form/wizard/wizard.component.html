<div class="widgets">
  <div class="row">
    <div class="col-md-12">
      <ba-panel title="Form Wizard" baPanelClass="with-scroll">
        <ba-wizard>
          <ba-wizard-step title="Personal info" [form]="personalInfoForm">
            <form #personalInfoForm="ngForm" novalidate>
              <div class="row">
                <div class="col-md-6">
                  <div
                    class="form-group has-feedback"
                    [class.has-error]="username.invalid && (username.dirty || personalInfoForm.submitted)"
                  >
                    <label for="exampleUsername1">Username</label>
                    <input
                      type="text"
                      class="form-control"
                      id="exampleUsername1"
                      name="username"
                      placeholder="Username"
                      [(ngModel)]="personalInfo.username"
                      #username="ngModel"
                      required
                    >
                    <span class="help-block error-block basic-block">Required</span>
                  </div>
                  <div
                    class="form-group"
                    [class.has-error]="email.invalid && (email.dirty || personalInfoForm.submitted)"
                  >
                    <label for="exampleInputEmail1">Email address</label>
                    <input
                      type="email"
                      class="form-control"
                      id="exampleInputEmail1"
                      name="email"
                      placeholder="Email"
                      [(ngModel)]="personalInfo.email"
                      #email="ngModel"
                      required
                      email
                    >
                    <span class="help-block error-block basic-block">Proper email required</span>
                  </div>
                </div>
                <div class="col-md-6">
                  <div
                    class="form-group"
                    [class.has-error]="password.invalid && (password.dirty || personalInfoForm.submitted)"
                  >
                    <label for="exampleInputPassword1">Password</label>
                    <input
                      type="password"
                      class="form-control"
                      id="exampleInputPassword1"
                      name="password"
                      placeholder="Password"
                      [(ngModel)]="personalInfo.password"
                      #password="ngModel"
                      required
                    >
                    <span class="help-block error-block basic-block">Required</span>
                  </div>
                  <div
                    class="form-group"
                    [class.has-error]="(!arePersonalInfoPasswordsEqual() || confirmPassword.invalid) && (confirmPassword.dirty || personalInfoForm.submitted)"
                  >
                    <label for="exampleInputConfirmPassword1">Confirm Password</label>
                    <input
                      type="password"
                      class="form-control"
                      id="exampleInputConfirmPassword1"
                      name="confirmPassword"
                      placeholder="Confirm Password"
                      [(ngModel)]="personalInfo.confirmPassword"
                      #confirmPassword="ngModel"
                      required
                    >
                    <span class="help-block error-block basic-block">Passwords should match</span>
                  </div>
                </div>
              </div>
            </form>
          </ba-wizard-step>
          <ba-wizard-step title="Product Info" [form]="productInfoForm">
            <form #productInfoForm="ngForm" novalidate>
              <div class="row">
                <div class="col-md-6">
                  <div
                    class="form-group"
                    [class.has-error]="productName.invalid && (productName.dirty || productInfoForm.submitted)"
                  >
                    <label for="productName">Product name</label>
                    <input
                      type="text"
                      class="form-control"
                      id="productName"
                      name="productName"
                      placeholder="Product name"
                      [(ngModel)]="productInfo.productName"
                      #productName="ngModel"
                      required
                    >
                    <span class="help-block error-block basic-block">Required</span>
                  </div>
                  <div
                    class="form-group"
                    [class.has-error]="productId.invalid && (productId.dirty || productInfoForm.submitted)"
                  >
                    <label for="productId">Product id</label>
                    <input
                      type="text"
                      class="form-control"
                      id="productId"
                      name="productId"
                      placeholder="productId"
                      [(ngModel)]="productInfo.productId"
                      #productId="ngModel"
                      required
                    >
                    <span class="help-block error-block basic-block">Required</span>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group">
                    <label for="category">Category</label>
                    <select
                      class="form-control form-select"
                      id="category"
                      name="category"
                      [(ngModel)]="productInfo.category"
                    >
                      <option>Electronics</option>
                      <option>Toys</option>
                      <option>Accessories</option>
                    </select>
                  </div>
                </div>
              </div>
            </form>
          </ba-wizard-step>
          <ba-wizard-step title="Shipment" [form]="addressForm">
            <form #addressForm="ngForm" novalidate>
              <div class="row">
                <div class="col-md-6">
                  <div
                    class="form-group"
                    [class.has-error]="address.invalid && (address.dirty || addressForm.submitted)"
                  >
                    <label for="address">Shipment address</label>
                    <input
                      type="text"
                      class="form-control"
                      id="address"
                      name="address"
                      placeholder="Shipment address"
                      [(ngModel)]="shipment.address"
                      #address="ngModel"
                      required
                    >
                    <span class="help-block error-block basic-block">Required</span>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group">
                    <label for="method">Shipment method</label>
                    <select
                      class="form-control form-select"
                      id="method"
                      name="method"
                      [(ngModel)]="shipment.method"
                    >
                      <option>Fast &amp; expensive</option>
                      <option>Cheap &amp; free</option>
                    </select>
                  </div>
                </div>
              </div>
            <div class="checkbox">
              <label class="custom-checkbox">
                <input type="checkbox" name="save" [(ngModel)]="shipment.save">
                <span>Save shipment info</span>
              </label>
            </div>
            </form>
          </ba-wizard-step>
          <ba-wizard-step title="Finish">
            <form class="form-horizontal" novalidate>
              Congratulations! You have successfully filled the form!
            </form>
          </ba-wizard-step>
        </ba-wizard>
      </ba-panel>
    </div>
  </div>
</div>
