<div class="feed-messages-container" trackWidth [minWidth]="360" (trackWidthChange)="smallContainerWidth.set($event)">
  @for (message of feed; track $index) {
    <div class="feed-message" (click)="expandMessage(message)">
      @if (message.type === 'text-message') {
        <div class="message-icon">
          <img class="photo-icon" [src]="message.author | profilePicture" [alt]="message.author">
        </div>
      } @else {
        <div class="message-icon">
          <img class="photo-icon" [src]="message.author | profilePicture" [alt]="message.author">
          <span class="sub-photo-icon" [class]="message.type"></span>
        </div>
      }
      <div class="text-block text-message">
        <div class="message-header">
          <span class="author">{{ message.author }} {{ message.surname }}</span>
        </div>
        <div class="message-content line-clamp" [class.line-clamp-2]="!message.expanded">
          @if (message.preview) {<span>{{ message.header }} </span>}{{ message.text }}
        </div>
        @if (message.preview) {
          <div class="preview" [hidden]="!message.expanded">
            <a [href]="message.link" target="_blank" rel="noopener">
              <img [src]="message.preview | appImage" alt="">
            </a>
          </div>
        }
        <div class="message-time" [hidden]="!message.expanded">
          <div class="post-time">
            {{ message.time }}
          </div>
          <div class="ago-time">
            {{ message.ago }}
          </div>
        </div>
      </div>
    </div>
  }
</div>
