<div class="channels-block" [class.transparent]="transparent">
  <div class="chart-bg"></div>
  <div class="traffic-chart" id="trafficChart">
    <div class="canvas-holder">
      <canvas baseChart id="chart-area" width="280" height="280" type="doughnut"
              [data]="doughnutData" [options]="options"></canvas>
      <div class="traffic-text">
        1,900,128
        <span>Views Total</span>
      </div>
    </div>
  </div>

  <div class="channels-info">
    <div>
      @for (label of labels; track label; let i = $index) {
        <div class="channels-info-item">
          <div class="legend-color" [style.background-color]="backgroundColor[i]"></div>
          <p>{{ label }}<span class="channel-number">+{{ percentage[i] }}%</span></p>
          <div class="progress progress-sm channel-progress">
            <div class="progress-bar" role="progressbar"
                 [attr.aria-valuenow]="percentage[i]" aria-valuemin="0" aria-valuemax="100"
                 [style.width.%]="percentage[i]">
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
