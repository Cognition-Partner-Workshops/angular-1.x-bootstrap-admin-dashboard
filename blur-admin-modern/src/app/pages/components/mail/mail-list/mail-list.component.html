<div class="side-message-navigation" [class.expanded]="tab.navigationCollapsed()">
  <div class="mail-messages-control side-message-navigation-item">
    <div class="toggle-navigation-container">
      <a class="collapse-navigation-link ion-navicon" role="button" (click)="tab.toggleNavigation()"></a>
    </div>
    <label class="checkbox-inline custom-checkbox nowrap">
      <input type="checkbox" id="inlineCheckbox01" value="option1">
      <span class="select-all-label">Select All</span>
    </label>
    <button type="button" class="btn btn-icon refresh-button"><i class="ion-refresh"></i></button>
    <div class="btn-group" ngbDropdown>
      <button type="button" class="btn more-button" ngbDropdownToggle>More <span class="caret"></span></button>
      <div ngbDropdownMenu>
        <a ngbDropdownItem>Action</a>
        <a ngbDropdownItem>Another action</a>
        <a ngbDropdownItem>Something else here</a>
        <div class="dropdown-divider"></div>
        <a ngbDropdownItem>Separated link</a>
      </div>
    </div>
  </div>
  <div class="messages">
    <table>
      @for (m of messages(); track $index) {
        <tr class="side-message-navigation-item little-human shineHover {{ m.tag }}">
          <td class="check-td">
            <div class="mail-checkbox">
              <label class="checkbox-inline custom-checkbox nowrap"><input type="checkbox"><span></span></label>
            </div>
          </td>
          <td class="photo-td" [routerLink]="['/components/mail', label(), m.id]">
            <img [src]="m.name.split(' ')[0] | profilePicture" class="little-human-picture">
          </td>
          <td [routerLink]="['/components/mail', label(), m.id]">
            <div class="name-container">
              <div><span class="name">{{ m.name }}</span></div>
              <div><span class="tag label label-primary {{ m.tag }}">{{ m.tag }}</span></div>
            </div>
          </td>
          <td [routerLink]="['/components/mail', label(), m.id]"><div class="additional-info"><span class="subject"> {{ m.subject }}</span></div></td>
          <td [routerLink]="['/components/mail', label(), m.id]"><div class="mail-body-part">{{ m.body | plainText }}</div></td>
          <td class="date"><span>{{ m.date | date: 'MMM d HH:mm' }}</span></td>
        </tr>
      }
    </table>
  </div>
</div>
