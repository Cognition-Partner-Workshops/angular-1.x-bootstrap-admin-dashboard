<div class="widgets">
  <div class="row">
    <div class="col-md-6">
      <div baPanel title="Kameleon SVG Icons" baPanelClass="with-scroll">
        <ng-container *ngTemplateOutlet="kameleonTpl" />
      </div>
      <div baPanel title="Socicon" baPanelClass="with-scroll">
        <ng-container *ngTemplateOutlet="sociconTpl" />
      </div>
    </div>
    <div class="col-md-6">
      <div baPanel title="Icons With Rounded Background" baPanelClass="with-scroll">
        <ng-container *ngTemplateOutlet="kameleonRoundedTpl" />
      </div>
      <div baPanel title="ionicons" baPanelClass="with-scroll">
        <ng-container *ngTemplateOutlet="ioniconsTpl" />
      </div>
      <div baPanel title="Font Awesome Icons" baPanelClass="with-scroll">
        <ng-container *ngTemplateOutlet="fontAwesomeTpl" />
      </div>
    </div>
  </div>
</div>

<ng-template #kameleonTpl>
  <div class="row clearfix">
    <div class="kameleon-row" *ngFor="let icon of kameleonIcons">
      <div class="kameleon-icon"><img [src]="icon.img | kameleonImg"><span>{{ icon.name }}</span></div>
    </div>
  </div>
  <a href="http://www.kameleon.pics/" target="_blank" class="see-all-icons">See all Kamaleon icons</a>
</ng-template>

<ng-template #kameleonRoundedTpl>
  <div class="row clearfix">
    <div class="kameleon-row" *ngFor="let icon of kameleonRoundedIcons">
      <div class="kameleon-icon with-round-bg" [ngClass]="icon.color"><img [src]="icon.img | kameleonImg"><span>{{ icon.name }}</span></div>
    </div>
  </div>
  <a href="http://www.kameleon.pics/" target="_blank" class="see-all-icons">See all Kamaleon icons</a>
</ng-template>

<ng-template #ioniconsTpl>
  <div class="row icons-list primary">
    <div class="col-2" *ngFor="let icon of ionicons"><i [class]="icon"></i></div>
  </div>
  <a href="http://ionicons.com/" target="_blank" class="see-all-icons">See all ionicons icons</a>
</ng-template>

<ng-template #fontAwesomeTpl>
  <div class="row icons-list success awesomeIcons">
    <div class="col-2" *ngFor="let icon of fontAwesomeIcons"><i [class]="icon"></i></div>
  </div>
  <a href="http://fortawesome.github.io/Font-Awesome/icons/" target="_blank" class="see-all-icons">See all Font Awesome icons</a>
</ng-template>

<ng-template #sociconTpl>
  <div class="row icons-list danger">
    <div class="col-2" *ngFor="let icon of socicon"><i class="socicon">{{ icon }}</i></div>
  </div>
  <a href="http://www.socicon.com/chart.php" target="_blank" class="see-all-icons">See all Socicon icons</a>
</ng-template>
