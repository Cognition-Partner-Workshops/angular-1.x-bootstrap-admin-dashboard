<div ngbAccordion class="panel-group">
  <div ngbAccordionItem #g1="ngbAccordionItem" [collapsed]="false" class="panel bootstrap-panel accordion-panel panel-default" [class.panel-open]="!g1.collapsed"><div ngbAccordionHeader class="panel-heading"><button ngbAccordionButton class="accordion-toggle panel-title">Static Header, initially expanded</button></div><div ngbAccordionCollapse><div ngbAccordionBody class="panel-body"><ng-template>This content is straight in the template.</ng-template></div></div></div>
  <div ngbAccordionItem class="panel bootstrap-panel accordion-panel panel-default"><div ngbAccordionHeader class="panel-heading"><button ngbAccordionButton class="accordion-toggle panel-title">Dynamic Body Content</button></div><div ngbAccordionCollapse><div ngbAccordionBody class="panel-body"><ng-template><p>The body of the uib-accordion group grows to fit the contents</p><button type="button" class="btn btn-primary btn-sm">Add Item</button></ng-template></div></div></div>
  <div ngbAccordionItem class="panel bootstrap-panel accordion-panel panel-default"><div ngbAccordionHeader class="panel-heading"><button ngbAccordionButton class="accordion-toggle panel-title">Custom template</button></div><div ngbAccordionCollapse><div ngbAccordionBody class="panel-body"><ng-template>Hello</ng-template></div></div></div>
  <div ngbAccordionItem class="panel bootstrap-panel accordion-panel panel-default"><div ngbAccordionHeader class="panel-heading"><button ngbAccordionButton class="accordion-toggle panel-title">I can have markup, too! <i class="fa pull-right ion-settings"></i></button></div><div ngbAccordionCollapse><div ngbAccordionBody class="panel-body"><ng-template>This is just some content to illustrate fancy headings.</ng-template></div></div></div>
</div>
