<div ngbAccordion class="panel-group">
  <div ngbAccordionItem [collapsed]="true" class="panel panel-primary bootstrap-panel accordion-panel"><div ngbAccordionHeader class="panel-heading"><button ngbAccordionButton class="accordion-toggle panel-title">Primary</button></div><div ngbAccordionCollapse><div ngbAccordionBody class="panel-body"><ng-template>Primary <i class="ion-heart"></i></ng-template></div></div></div>
  <div ngbAccordionItem [collapsed]="true" class="panel panel-success bootstrap-panel accordion-panel"><div ngbAccordionHeader class="panel-heading"><button ngbAccordionButton class="accordion-toggle panel-title">Success</button></div><div ngbAccordionCollapse><div ngbAccordionBody class="panel-body"><ng-template>Success <i class="ion-checkmark-round"></i></ng-template></div></div></div>
  <div ngbAccordionItem [collapsed]="true" class="panel panel-info bootstrap-panel accordion-panel"><div ngbAccordionHeader class="panel-heading"><button ngbAccordionButton class="accordion-toggle panel-title">Info</button></div><div ngbAccordionCollapse><div ngbAccordionBody class="panel-body"><ng-template>Info <i class="ion-information-circled"></i></ng-template></div></div></div>
  <div ngbAccordionItem [collapsed]="true" class="panel panel-warning bootstrap-panel accordion-panel"><div ngbAccordionHeader class="panel-heading"><button ngbAccordionButton class="accordion-toggle panel-title">Warning</button></div><div ngbAccordionCollapse><div ngbAccordionBody class="panel-body"><ng-template>Warning <i class="ion-alert"></i></ng-template></div></div></div>
  <div ngbAccordionItem [collapsed]="true" class="panel panel-danger bootstrap-panel accordion-panel"><div ngbAccordionHeader class="panel-heading"><button ngbAccordionButton class="accordion-toggle panel-title">Danger</button></div><div ngbAccordionCollapse><div ngbAccordionBody class="panel-body"><ng-template>Danger <i class="ion-nuclear"></i></ng-template></div></div></div>
</div>
