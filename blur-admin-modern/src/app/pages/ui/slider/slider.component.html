<div class="row"><div class="col-md-12"><div baPanel title="Ion Range Slider" baPanelClass="with-scroll">
  <div class="slider-box"><h5>Basic</h5><ba-slider type="single" [grid]="false" [min]="0" [max]="100" [from]="45" [disable]="false" /></div>
  <div class="slider-box"><h5>With prefix</h5><ba-slider type="single" [grid]="true" [min]="100" [max]="1200" prefix="$" [from]="420" [disable]="false" /></div>
  <div class="slider-box"><h5>With postfix</h5><ba-slider type="single" [grid]="true" [min]="-90" [max]="90" postfix="°" [from]="36" [disable]="false" /></div>
  <div class="slider-box"><h5>Two way range</h5><ba-slider type="double" [grid]="true" [min]="100" [max]="1200" [from]="420" [to]="900" [disable]="false" /></div>
  <div class="slider-box"><h5>With Steps</h5><ba-slider type="single" [grid]="true" [min]="0" [max]="1000" [from]="300" [step]="50" [disable]="false" /></div>
  <div class="slider-box"><h5>Decorating numbers</h5><ngx-slider [(value)]="decoratedValue" [options]="decoratedOptions" /></div>
  <div class="slider-box"><h5>Using custom values array</h5><ngx-slider [(value)]="monthValue" [options]="monthOptions" /></div>
  <div class="slider-box"><h5>Disabled</h5><ba-slider type="single" [grid]="false" [min]="0" [max]="100" [from]="45" [disable]="true" /></div>
</div></div></div>
