<app-ba-panel title="Timeline">
  <div class="timeline">
    @for (item of timelineItems; track item.time) {
      <div class="timeline-item">
        <div class="timeline-badge" [style.background]="item.color">
          <i [class]="item.icon"></i>
        </div>
        <div class="timeline-panel">
          <div class="timeline-heading">
            <span class="timeline-time">{{ item.time }}</span>
            <h4 class="timeline-title">{{ item.title }}</h4>
          </div>
          <div class="timeline-body">
            <p>{{ item.content }}</p>
          </div>
        </div>
      </div>
    }
  </div>
</app-ba-panel>
