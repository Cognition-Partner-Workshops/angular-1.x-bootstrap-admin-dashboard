<div class="row">
  <div class="col-md-6">
    <div class="ba-panel">
      <div class="ba-panel-header">Basic Form</div>
      <div class="ba-panel-body">
        <form [formGroup]="basicForm">
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control" formControlName="email" placeholder="Email">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" formControlName="password" placeholder="Password">
          </div>
          <button type="submit" class="btn btn-primary">Submit</button>
        </form>
      </div>
    </div>
  </div>

  <div class="col-md-6">
    <div class="ba-panel">
      <div class="ba-panel-header">Horizontal Form</div>
      <div class="ba-panel-body">
        <form [formGroup]="horizontalForm">
          <div class="mb-3 row">
            <label class="col-sm-3 col-form-label">Email</label>
            <div class="col-sm-9">
              <input type="email" class="form-control" formControlName="email" placeholder="Email">
            </div>
          </div>
          <div class="mb-3 row">
            <label class="col-sm-3 col-form-label">Password</label>
            <div class="col-sm-9">
              <input type="password" class="form-control" formControlName="password" placeholder="Password">
            </div>
          </div>
          <div class="mb-3 row">
            <div class="col-sm-9 offset-sm-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" formControlName="remember" id="remember">
                <label class="form-check-label" for="remember">Remember me</label>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-sm-9 offset-sm-3">
              <button type="submit" class="btn btn-primary">Sign in</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-md-6">
    <div class="ba-panel">
      <div class="ba-panel-header">Inline Form</div>
      <div class="ba-panel-body">
        <form [formGroup]="inlineForm" class="row row-cols-auto g-3 align-items-center">
          <div class="col">
            <input type="text" class="form-control" formControlName="name" placeholder="Jane Doe">
          </div>
          <div class="col">
            <input type="email" class="form-control" formControlName="email" placeholder="email&#64;example.com">
          </div>
          <div class="col">
            <button type="submit" class="btn btn-primary">Send invitation</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="col-md-6">
    <div class="ba-panel">
      <div class="ba-panel-header">Block Form</div>
      <div class="ba-panel-body">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" placeholder="Username">
        </div>
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" placeholder="Full Name">
        </div>
        <div class="mb-3">
          <label class="form-label">Address</label>
          <textarea class="form-control" rows="3" placeholder="Address"></textarea>
        </div>
        <div class="d-grid">
          <button type="button" class="btn btn-primary">Save Changes</button>
        </div>
      </div>
    </div>
  </div>
</div>
