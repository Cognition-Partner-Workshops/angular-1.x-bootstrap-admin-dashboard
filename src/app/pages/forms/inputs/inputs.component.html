<div class="row">
  <div class="col-md-6">
    <div class="ba-panel">
      <div class="ba-panel-header">Standard Inputs</div>
      <div class="ba-panel-body">
        <form [formGroup]="form">
          <div class="mb-3">
            <label class="form-label">Text Input</label>
            <input type="text" class="form-control" formControlName="textInput" placeholder="Enter text">
          </div>
          <div class="mb-3">
            <label class="form-label">Email Input</label>
            <input type="email" class="form-control" formControlName="emailInput" placeholder="Enter email">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" formControlName="passwordInput" placeholder="Password">
          </div>
          <div class="mb-3">
            <label class="form-label">Disabled Input</label>
            <input type="text" class="form-control" formControlName="disabledInput">
          </div>
          <div class="mb-3">
            <label class="form-label">Textarea</label>
            <textarea class="form-control" formControlName="textareaInput" rows="3" placeholder="Enter text..."></textarea>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="col-md-6">
    <div class="ba-panel">
      <div class="ba-panel-header">Selects & Checkboxes</div>
      <div class="ba-panel-body">
        <form [formGroup]="form">
          <div class="mb-3">
            <label class="form-label">Select</label>
            <select class="form-select" formControlName="selectInput">
              <option value="1">Option 1</option>
              <option value="2">Option 2</option>
              <option value="3">Option 3</option>
              <option value="4">Option 4</option>
              <option value="5">Option 5</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Checkboxes</label>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" formControlName="checkbox1" id="check1">
              <label class="form-check-label" for="check1">Option 1 - checked</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" formControlName="checkbox2" id="check2">
              <label class="form-check-label" for="check2">Option 2</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" formControlName="checkbox3" id="check3" [attr.disabled]="true">
              <label class="form-check-label" for="check3">Disabled option</label>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Radio Buttons</label>
            <div class="form-check">
              <input class="form-check-input" type="radio" formControlName="radio" value="option1" id="radio1">
              <label class="form-check-label" for="radio1">Option 1</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" formControlName="radio" value="option2" id="radio2">
              <label class="form-check-label" for="radio2">Option 2</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" formControlName="radio" value="option3" id="radio3">
              <label class="form-check-label" for="radio3">Option 3</label>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-md-6">
    <div class="ba-panel">
      <div class="ba-panel-header">Input Widgets — Date Picker</div>
      <div class="ba-panel-body">
        <form [formGroup]="form">
          <div class="mb-3">
            <label class="form-label">Date Picker</label>
            <input type="date" class="form-control" formControlName="dateInput">
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="col-md-6">
    <div class="ba-panel">
      <div class="ba-panel-header">Input Widgets — Tags Input</div>
      <div class="ba-panel-body">
        <div class="tags-container">
          @for (tag of tags(); track $index) {
            <span class="badge bg-primary me-1 mb-1">
              {{ tag }}
              <button type="button" class="btn-close btn-close-white ms-1" (click)="removeTag($index)"></button>
            </span>
          }
        </div>
        <input type="text" class="form-control mt-2" placeholder="Add a tag..." (keyup.enter)="addTag($event)">
      </div>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-md-6">
    <div class="ba-panel">
      <div class="ba-panel-header">Switches</div>
      <div class="ba-panel-body">
        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" [checked]="switchValues()[0]" (change)="toggleSwitch(0)" id="switch1">
          <label class="form-check-label" for="switch1">Primary Switch (on)</label>
        </div>
        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" [checked]="switchValues()[1]" (change)="toggleSwitch(1)" id="switch2">
          <label class="form-check-label" for="switch2">Warning Switch (off)</label>
        </div>
        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" [checked]="switchValues()[2]" (change)="toggleSwitch(2)" id="switch3">
          <label class="form-check-label" for="switch3">Success Switch (on)</label>
        </div>
      </div>
    </div>
  </div>
</div>
