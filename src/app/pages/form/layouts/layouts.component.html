<div class="row">
  <div class="col-lg-6">
    <app-panel title="Inline Form" panelClass="with-scroll">
      <form class="row g-3">
        <div class="col-auto">
          <input type="text" class="form-control" placeholder="Jane Doe">
        </div>
        <div class="col-auto">
          <input type="email" class="form-control" placeholder="jane@example.com">
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-primary">Submit</button>
        </div>
      </form>
    </app-panel>
  </div>
  <div class="col-lg-6">
    <app-panel title="Horizontal Form" panelClass="with-scroll">
      <form>
        <div class="row mb-3">
          <label class="col-sm-3 col-form-label">Email</label>
          <div class="col-sm-9"><input type="email" class="form-control" placeholder="Email"></div>
        </div>
        <div class="row mb-3">
          <label class="col-sm-3 col-form-label">Password</label>
          <div class="col-sm-9"><input type="password" class="form-control" placeholder="Password"></div>
        </div>
        <button type="submit" class="btn btn-primary">Sign in</button>
      </form>
    </app-panel>
  </div>
</div>
<div class="row">
  <div class="col-12">
    <app-panel title="Basic Form" panelClass="with-scroll">
      <form>
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" placeholder="Full Name">
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" placeholder="Email">
        </div>
        <div class="mb-3">
          <label class="form-label">Website</label>
          <input type="url" class="form-control" placeholder="https://example.com">
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
    </app-panel>
  </div>
</div>
