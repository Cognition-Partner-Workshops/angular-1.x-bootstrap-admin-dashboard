<div class="row">
  <div class="col-lg-6">
    <app-panel title="Standard Fields" panelClass="with-scroll">
      <div class="mb-3">
        <label class="form-label">Default Input</label>
        <input type="text" class="form-control" placeholder="Default Input">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" placeholder="Password">
      </div>
      <div class="mb-3">
        <label class="form-label">Disabled Input</label>
        <input type="text" class="form-control" disabled placeholder="Disabled">
      </div>
      <div class="mb-3">
        <label class="form-label">Textarea</label>
        <textarea class="form-control" rows="3" placeholder="Textarea"></textarea>
      </div>
    </app-panel>
  </div>
  <div class="col-lg-6">
    <app-panel title="Selects & Checkboxes" panelClass="with-scroll">
      <div class="mb-3">
        <label class="form-label">Select</label>
        <select class="form-select">
          <option>Option 1</option>
          <option>Option 2</option>
          <option>Option 3</option>
        </select>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="check1">
        <label class="form-check-label" for="check1">Checkbox 1</label>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="radio" name="radios" id="radio1" checked>
        <label class="form-check-label" for="radio1">Radio 1</label>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="radio" name="radios" id="radio2">
        <label class="form-check-label" for="radio2">Radio 2</label>
      </div>
    </app-panel>
  </div>
</div>
