<div class="row">
  <div class="col-lg-6">
    <app-ba-panel title="Horizontal Form">
      <form [formGroup]="horizontalForm" (ngSubmit)="onHorizontalSubmit()">
        <div class="mb-3 row">
          <label class="col-sm-3 col-form-label">Email</label>
          <div class="col-sm-9">
            <input type="email" class="form-control" formControlName="email" placeholder="Email">
          </div>
        </div>
        <div class="mb-3 row">
          <label class="col-sm-3 col-form-label">Password</label>
          <div class="col-sm-9">
            <input type="password" class="form-control" formControlName="password" placeholder="Password">
          </div>
        </div>
        <div class="mb-3 row">
          <div class="col-sm-9 offset-sm-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" formControlName="remember" id="rememberMe">
              <label class="form-check-label" for="rememberMe">Remember me</label>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-sm-9 offset-sm-3">
            <button type="submit" class="btn btn-primary" [disabled]="!horizontalForm.valid">Sign in</button>
          </div>
        </div>
      </form>
    </app-ba-panel>
  </div>
  <div class="col-lg-6">
    <app-ba-panel title="Basic Form">
      <form>
        <div class="mb-3">
          <label class="form-label">Email address</label>
          <input type="email" class="form-control" placeholder="Enter email">
          <div class="form-text">We'll never share your email.</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" placeholder="Password">
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="basicCheck">
          <label class="form-check-label" for="basicCheck">Check me out</label>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
    </app-ba-panel>
  </div>
</div>

<div class="row">
  <div class="col-lg-12">
    <app-ba-panel title="Inline Form">
      <form [formGroup]="inlineForm" (ngSubmit)="onInlineSubmit()" class="row row-cols-auto g-3 align-items-center">
        <div class="col">
          <input type="text" class="form-control" formControlName="name" placeholder="Name">
        </div>
        <div class="col">
          <input type="email" class="form-control" formControlName="email" placeholder="Email">
        </div>
        <div class="col">
          <button type="submit" class="btn btn-primary" [disabled]="!inlineForm.valid">Send Invitation</button>
        </div>
      </form>
    </app-ba-panel>
  </div>
</div>
