<div class="row">
  <div class="col-12">
    <app-panel title="Form Wizard" panelClass="with-scroll">
      <div class="wizard-container">
        <ul class="nav nav-pills wizard-steps mb-4">
          <li class="nav-item"><a class="nav-link" [class.active]="currentStep === 1" (click)="currentStep = 1">Step 1</a></li>
          <li class="nav-item"><a class="nav-link" [class.active]="currentStep === 2" (click)="currentStep = 2">Step 2</a></li>
          <li class="nav-item"><a class="nav-link" [class.active]="currentStep === 3" (click)="currentStep = 3">Step 3</a></li>
        </ul>
        <div class="progress mb-4"><div class="progress-bar" [style.width.%]="(currentStep / 3) * 100"></div></div>
        @if (currentStep === 1) {
          <div class="step-content">
            <h4>Personal Information</h4>
            <div class="mb-3"><label class="form-label">First Name</label><input type="text" class="form-control"></div>
            <div class="mb-3"><label class="form-label">Last Name</label><input type="text" class="form-control"></div>
            <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control"></div>
          </div>
        }
        @if (currentStep === 2) {
          <div class="step-content">
            <h4>Company Information</h4>
            <div class="mb-3"><label class="form-label">Company</label><input type="text" class="form-control"></div>
            <div class="mb-3"><label class="form-label">Position</label><input type="text" class="form-control"></div>
          </div>
        }
        @if (currentStep === 3) {
          <div class="step-content">
            <h4>Confirmation</h4>
            <p>Review your information and submit.</p>
          </div>
        }
        <div class="wizard-nav mt-3">
          <button class="btn btn-secondary" [disabled]="currentStep === 1" (click)="currentStep = currentStep - 1">Previous</button>
          <button class="btn btn-primary ms-2" [disabled]="currentStep === 3" (click)="currentStep = currentStep + 1">Next</button>
        </div>
      </div>
    </app-panel>
  </div>
</div>
