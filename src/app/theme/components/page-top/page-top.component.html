<div class="page-top clearfix" [class.scrolled]="scrolled()">
  <a routerLink="/dashboard" class="al-logo clearfix"><span>Blur</span>Admin</a>
  <a href="javascript:void(0)" class="collapse-menu-link fa fa-bars" (click)="toggleSidebar()"></a>

  <div class="search">
    <i class="fa fa-search"></i>
    <input id="searchInput" type="text" placeholder="Search for...">
  </div>

  <div class="user-profile clearfix">
    <div class="al-user-profile" [class.open]="isProfileOpen">
      <a class="profile-toggle-link" (click)="toggleProfile()">
        <img src="assets/img/app/profile/Nasta.png" alt="Profile">
      </a>
      @if (isProfileOpen) {
        <ul class="top-dropdown-menu profile-dropdown">
          <li><i class="dropdown-arr"></i></li>
          <li><a routerLink="/profile"><i class="fa fa-user"></i>Profile</a></li>
          <li><a href="javascript:void(0)"><i class="fa fa-cog"></i>Settings</a></li>
          <li><a href="javascript:void(0)" class="signout"><i class="fa fa-power-off"></i>Sign out</a></li>
        </ul>
      }
    </div>
    <app-msg-center></app-msg-center>
  </div>
</div>
